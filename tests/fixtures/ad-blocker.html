<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Ad blocker regression fixture</title></head>
<body>
  <nav id="navigation"><a href="#article">Article</a></nav>
  <!-- #AdBox2 is a generic EasyList hide, which content/ad-blocker-generic.css carries;
       #ad-carousel is one of the generic selectors a host cancels, so the content script
       assembles it per frame. The two cover both halves of the cosmetic layer. -->
  <aside id="AdBox2">Ad placement</aside>
  <aside id="ad-carousel">Ad carousel</aside>
  <script>
    // Read while the parser is still inside <body> and nothing has painted, which is what
    // makes this a pre-paint reading rather than an eventual one. The registered generic
    // stylesheet already applies here; #ad-carousel cannot, since the content script is
    // still waiting on its round trip to the service worker.
    window.fixtureEarly = {
      paints: performance.getEntriesByType('paint').length,
      adBox: getComputedStyle(document.getElementById('AdBox2')).display,
      adCarousel: getComputedStyle(document.getElementById('ad-carousel')).display
    };
  </script>
  <article id="article">Article content</article>
  <form id="login"><input aria-label="Username" name="username"><button type="submit">Sign in</button></form>
  <button id="checkout" type="button">Continue to checkout</button>
  <button id="consent" type="button">Consent choices</button>
  <video id="video" src="ad-blocker-video.mp4" muted playsinline controls></video>
  <script>
    window.fixtureActions = { login: 0, checkout: 0, consent: 0 };
    document.getElementById('login').addEventListener('submit', event => { event.preventDefault(); fixtureActions.login++; });
    document.getElementById('checkout').addEventListener('click', () => fixtureActions.checkout++);
    document.getElementById('consent').addEventListener('click', () => fixtureActions.consent++);
  </script>
</body>
</html>
